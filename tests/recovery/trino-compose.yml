services:
  iceberg-jdbc:
    image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    environment:
      POSTGRES_DB: iceberg_fixture
      POSTGRES_USER: fixture
      POSTGRES_PASSWORD: recovery-test-only
    ports: ["127.0.0.1:49318:5432"]
    volumes:
      - ./trino/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixture -d iceberg_fixture"]
      interval: 2s
      retries: 40
  trino:
    image: trinodb/trino:483@sha256:db58cc93e593a2706553745f276bb119c9810e69918be56ecde088ba7ccb0534
    user: "0:0"
    ports: ["127.0.0.1:49319:8080"]
    volumes:
      - ./trino:/etc/trino:ro
      - ${RIVUS_RECOVERY_TRINO_ROOT:-/tmp/colima}/rivus-recovery-trino-data:/var/lib/trino
      - ${RIVUS_RECOVERY_TRINO_ROOT:-/tmp/colima}/rivus-recovery-trino-warehouse:/warehouse
    depends_on:
      iceberg-jdbc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/v1/info"]
      interval: 2s
      retries: 60
