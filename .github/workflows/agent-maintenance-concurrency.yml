name: Agent maintenance concurrency patch

on:
  push:
    branches:
      - agent/maintenance-concurrency-alerts
    paths:
      - .github/workflows/agent-maintenance-concurrency.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'add maintenance concurrency patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maintenance-concurrency-alerts
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          worker = Path('pkg/connectors/iceberg/maintenance_worker.go')
          text = worker.read_text()

          old = '''\tif opts.TaskPageSize != 1 {
\t\topts.TaskPageSize = intEnv("RIVUS_MAINTENANCE_TASK_PAGE_SIZE", defaultMaintenanceTaskPageSize)
\t\tif opts.TaskPageSize != 1 {
\t\t\topts.TaskPageSize = 1
\t\t}
\t}
'''
          new = '''\tif opts.TaskPageSize <= 0 || opts.TaskPageSize > 100 {
\t\topts.TaskPageSize = intEnv("RIVUS_MAINTENANCE_TASK_PAGE_SIZE", defaultMaintenanceTaskPageSize)
\t\tif opts.TaskPageSize <= 0 || opts.TaskPageSize > 100 {
\t\t\topts.TaskPageSize = defaultMaintenanceTaskPageSize
\t\t}
\t}
'''
          if old not in text:
              raise SystemExit('task page size block not found')
          text = text.replace(old, new, 1)

          old = '''\tlog.Printf("[maintenance-worker %s] started queue=%t poll=%s lease=%s task_page=%d due_page=%d",
\t\topts.WorkerID, opts.Queue, opts.PollInterval, opts.LeaseDuration, opts.TaskPageSize, opts.DuePageSize)

\tvar jobs map[string]maintenanceWorkerJob
\tvar lastStateSync time.Time
'''
          new = '''\tconcurrency := maintenanceConcurrencyFromEnv()
\tqueueAlerts := newMaintenanceQueueAlertManager(opts.WorkerID)
\tregistry := &maintenanceWorkerRegistry{}
\tvar executorWG sync.WaitGroup
\tif opts.Queue {
\t\tstartMaintenanceExecutorPools(ctx, store, jobStore, registry, opts, concurrency, &executorWG)
\t\tdefer executorWG.Wait()
\t}

\tlog.Printf("[maintenance-worker %s] started queue=%t poll=%s lease=%s task_page=%d due_page=%d compact_concurrency=%d spark_concurrency=%d expire_concurrency=%d orphan_concurrency=%d",
\t\topts.WorkerID, opts.Queue, opts.PollInterval, opts.LeaseDuration, opts.TaskPageSize, opts.DuePageSize,
\t\tconcurrency.NativeCompact, concurrency.SparkCompact, concurrency.ExpireSnapshots, concurrency.OrphanCleanup)

\tvar jobs map[string]maintenanceWorkerJob
\tvar lastStateSync time.Time
'''
          if old not in text:
              raise SystemExit('startup block not found')
          text = text.replace(old, new, 1)

          old = '''\t\t\tjobs, err = syncMaintenanceStates(ctx, store, jobStore, now)
\t\t\tif err != nil {
\t\t\t\treturn err
\t\t\t}
\t\t\tlastStateSync = now
'''
          new = '''\t\t\tjobs, err = syncMaintenanceStates(ctx, store, jobStore, now)
\t\t\tif err != nil {
\t\t\t\treturn err
\t\t\t}
\t\t\tregistry.Replace(jobs)
\t\t\tlastStateSync = now
'''
          if old not in text:
              raise SystemExit('state sync block not found')
          text = text.replace(old, new, 1)

          old = '''\t\tif err := enqueueDueMaintenance(ctx, store, jobs, now, opts.DuePageSize); err != nil {
\t\t\treturn err
\t\t}
\t\tprocessed, err := processMaintenancePage(ctx, store, jobStore, jobs, opts, now)
\t\tif err != nil {
\t\t\treturn err
\t\t}
\t\tif !opts.Queue {
\t\t\tlog.Printf("[maintenance-worker %s] one-shot complete processed=%d", opts.WorkerID, processed)
\t\t\treturn nil
\t\t}
'''
          new = '''\t\tif err := enqueueDueMaintenance(ctx, store, jobs, now, opts.DuePageSize); err != nil {
\t\t\treturn err
\t\t}
\t\tif opts.Queue {
\t\t\tqueueAlerts.MaybeCheck(ctx, store, now)
\t\t} else {
\t\t\tprocessed, err := processMaintenancePage(ctx, store, jobStore, jobs, opts, now)
\t\t\tif err != nil {
\t\t\t\treturn err
\t\t\t}
\t\t\tlog.Printf("[maintenance-worker %s] one-shot complete processed=%d", opts.WorkerID, processed)
\t\t\treturn nil
\t\t}
'''
          if old not in text:
              raise SystemExit('process block not found')
          text = text.replace(old, new, 1)
          worker.write_text(text)

          native = Path('pkg/connectors/iceberg/maintenance_native.go')
          text = native.read_text()
          marker = '''func executeSparkCompactionFallback(
\tctx context.Context,
\tjobID string,
\tjobCfg *config.JobConfig,
\tstate meta.IcebergMaintenanceState,
\ttask meta.IcebergMaintenanceTask,
\tresult meta.IcebergMaintenanceResult,
\tsettings nativeMaintenanceSettings,
\tdeleteTriggered bool,
) nativeTaskOutcome {
'''
          replacement = marker + '''\treleaseSparkSlot, err := acquireMaintenanceSparkCompactionSlot(ctx)
\tif err != nil {
\t\tresult.Error = fmt.Sprintf("wait for Spark compaction slot: %v", err)
\t\treturn nativeTaskOutcome{Result: result, Retryable: true}
\t}
\tdefer releaseSparkSlot()
'''
          if marker not in text:
              raise SystemExit('spark fallback marker not found')
          text = text.replace(marker, replacement, 1)
          native.write_text(text)

          Path('pkg/meta/maintenance_operation_claim.go').write_text(r'''package meta

import (
    "context"
    "database/sql"
    "encoding/json"
    "fmt"
    "strings"
    "time"
)

// ClaimTasksForOperation claims only one maintenance operation. This lets the
// maintenance worker run independent bounded pools (for example, several
// snapshot-expiration workers while keeping compaction serialized) without a
// high-priority compact backlog starving lighter operations.
func (s *IcebergMaintenanceStore) ClaimTasksForOperation(ctx context.Context, workerID string, now time.Time, lease time.Duration, operation string, limit int) ([]IcebergMaintenanceTask, error) {
    operation = strings.TrimSpace(operation)
    if operation == "" {
        return nil, fmt.Errorf("maintenance operation is required")
    }
    if limit <= 0 || limit > 100 {
        limit = 1
    }
    if lease <= 0 {
        lease = 15 * time.Minute
    }
    tx, err := s.db.BeginTx(ctx, &sql.TxOptions{Isolation: sql.LevelReadCommitted})
    if err != nil {
        return nil, err
    }
    defer tx.Rollback()

    if _, err := tx.ExecContext(ctx, `UPDATE iceberg_maintenance_tasks
SET status='retry', lease_owner=NULL, lease_until=NULL, not_before=?, updated_at=UTC_TIMESTAMP(6)
WHERE status='leased' AND lease_until IS NOT NULL AND lease_until < ?`, now.UTC(), now.UTC()); err != nil {
        return nil, err
    }

    rows, err := tx.QueryContext(ctx, `SELECT id, idempotency_key, table_key, owner_job_id, operation,
 priority, status, attempt_count, not_before, schedule_window, payload_json, last_error,
 created_at, updated_at
FROM iceberg_maintenance_tasks
WHERE status IN ('queued','retry') AND not_before <= ? AND operation=?
ORDER BY priority ASC, not_before ASC, id ASC
LIMIT ? FOR UPDATE SKIP LOCKED`, now.UTC(), operation, limit)
    if err != nil {
        return nil, err
    }
    var tasks []IcebergMaintenanceTask
    for rows.Next() {
        var task IcebergMaintenanceTask
        var payloadJSON, lastError sql.NullString
        if err := rows.Scan(&task.ID, &task.IdempotencyKey, &task.TableKey, &task.OwnerJobID, &task.Operation,
            &task.Priority, &task.Status, &task.AttemptCount, &task.NotBefore, &task.ScheduleWindow,
            &payloadJSON, &lastError, &task.CreatedAt, &task.UpdatedAt); err != nil {
            rows.Close()
            return nil, err
        }
        if payloadJSON.Valid && strings.TrimSpace(payloadJSON.String) != "" {
            _ = json.Unmarshal([]byte(payloadJSON.String), &task.Payload)
        }
        if lastError.Valid {
            task.LastError = lastError.String
        }
        tasks = append(tasks, task)
    }
    if err := rows.Close(); err != nil {
        return nil, err
    }
    if err := rows.Err(); err != nil {
        return nil, err
    }

    until := now.Add(lease).UTC()
    for i := range tasks {
        res, err := tx.ExecContext(ctx, `UPDATE iceberg_maintenance_tasks
SET status='leased', lease_owner=?, lease_until=?, attempt_count=attempt_count+1, updated_at=UTC_TIMESTAMP(6)
WHERE id=? AND status IN ('queued','retry')`, workerID, until, tasks[i].ID)
        if err != nil {
            return nil, err
        }
        n, _ := res.RowsAffected()
        if n != 1 {
            return nil, fmt.Errorf("maintenance task %d lost while claiming", tasks[i].ID)
        }
        tasks[i].Status = MaintenanceTaskLeased
        tasks[i].LeaseOwner = workerID
        tasks[i].LeaseUntil = &until
        tasks[i].AttemptCount++
    }
    if err := tx.Commit(); err != nil {
        return nil, err
    }
    return tasks, nil
}
''')

          Path('pkg/connectors/iceberg/maintenance_executor_pool.go').write_text(r'''package iceberg

import (
    "context"
    "fmt"
    "log"
    "sync"
    "time"

    "github.com/gerinsp/rivus/pkg/meta"
)

const (
    maintenanceOperationCompact = "compact"
    maintenanceOperationExpire  = "expire_snapshots"
    maintenanceOperationOrphan  = "remove_orphan_files"
)

type maintenanceConcurrency struct {
    NativeCompact   int
    SparkCompact    int
    ExpireSnapshots int
    OrphanCleanup   int
}

func maintenanceConcurrencyFromEnv() maintenanceConcurrency {
    return maintenanceConcurrency{
        NativeCompact:   boundedMaintenanceConcurrency("RIVUS_MAINTENANCE_NATIVE_COMPACT_CONCURRENCY", 1),
        SparkCompact:    boundedMaintenanceConcurrency("RIVUS_MAINTENANCE_SPARK_COMPACT_CONCURRENCY", 1),
        ExpireSnapshots: boundedMaintenanceConcurrency("RIVUS_MAINTENANCE_EXPIRE_CONCURRENCY", 4),
        OrphanCleanup:   boundedMaintenanceConcurrency("RIVUS_MAINTENANCE_ORPHAN_CONCURRENCY", 1),
    }
}

func boundedMaintenanceConcurrency(key string, fallback int) int {
    value := intEnv(key, fallback)
    if value < 1 {
        return fallback
    }
    if value > 32 {
        return 32
    }
    return value
}

type maintenanceWorkerRegistry struct {
    mu   sync.RWMutex
    jobs map[string]maintenanceWorkerJob
}

func (r *maintenanceWorkerRegistry) Replace(jobs map[string]maintenanceWorkerJob) {
    r.mu.Lock()
    r.jobs = jobs
    r.mu.Unlock()
}

func (r *maintenanceWorkerRegistry) Snapshot() map[string]maintenanceWorkerJob {
    r.mu.RLock()
    jobs := r.jobs
    r.mu.RUnlock()
    return jobs
}

func startMaintenanceExecutorPools(
    ctx context.Context,
    store *meta.IcebergMaintenanceStore,
    jobStore meta.JobStore,
    registry *maintenanceWorkerRegistry,
    opts MaintenanceWorkerOptions,
    limits maintenanceConcurrency,
    wg *sync.WaitGroup,
) {
    specs := []struct {
        operation string
        workers   int
    }{
        {maintenanceOperationCompact, limits.NativeCompact},
        {maintenanceOperationExpire, limits.ExpireSnapshots},
        {maintenanceOperationOrphan, limits.OrphanCleanup},
    }
    for _, spec := range specs {
        for index := 0; index < spec.workers; index++ {
            wg.Add(1)
            go func(operation string, workerIndex int) {
                defer wg.Done()
                runMaintenanceOperationWorker(ctx, store, jobStore, registry, opts, operation, workerIndex)
            }(spec.operation, index)
        }
    }
}

func runMaintenanceOperationWorker(
    ctx context.Context,
    store *meta.IcebergMaintenanceStore,
    jobStore meta.JobStore,
    registry *maintenanceWorkerRegistry,
    opts MaintenanceWorkerOptions,
    operation string,
    workerIndex int,
) {
    idlePoll := minDuration(opts.PollInterval, 5*time.Second)
    if idlePoll <= 0 {
        idlePoll = 5 * time.Second
    }
    workerID := fmt.Sprintf("%s-%s-%d", opts.WorkerID, operation, workerIndex+1)
    for {
        if ctx.Err() != nil {
            return
        }
        tasks, err := store.ClaimTasksForOperation(ctx, workerID, time.Now().UTC(), opts.LeaseDuration, operation, 1)
        if err != nil {
            log.Printf("[maintenance-worker %s] claim operation=%s error=%v", workerID, operation, err)
            if !waitMaintenanceWorker(ctx, idlePoll) {
                return
            }
            continue
        }
        if len(tasks) == 0 {
            if !waitMaintenanceWorker(ctx, idlePoll) {
                return
            }
            continue
        }
        if _, err := processClaimedMaintenanceTasks(ctx, store, jobStore, registry.Snapshot(), opts, workerID, tasks, time.Now().UTC()); err != nil {
            log.Printf("[maintenance-worker %s] process operation=%s error=%v", workerID, operation, err)
        }
    }
}

func waitMaintenanceWorker(ctx context.Context, delay time.Duration) bool {
    timer := time.NewTimer(delay)
    defer timer.Stop()
    select {
    case <-ctx.Done():
        return false
    case <-timer.C:
        return true
    }
}

var (
    maintenanceSparkSlotsOnce sync.Once
    maintenanceSparkSlots     chan struct{}
)

func acquireMaintenanceSparkCompactionSlot(ctx context.Context) (func(), error) {
    maintenanceSparkSlotsOnce.Do(func() {
        limit := maintenanceConcurrencyFromEnv().SparkCompact
        maintenanceSparkSlots = make(chan struct{}, limit)
    })
    select {
    case maintenanceSparkSlots <- struct{}{}:
        return func() { <-maintenanceSparkSlots }, nil
    case <-ctx.Done():
        return nil, ctx.Err()
    }
}

func processClaimedMaintenanceTasks(
    ctx context.Context,
    store *meta.IcebergMaintenanceStore,
    jobStore meta.JobStore,
    jobs map[string]maintenanceWorkerJob,
    opts MaintenanceWorkerOptions,
    workerID string,
    tasks []meta.IcebergMaintenanceTask,
    now time.Time,
) (int, error) {
    if len(tasks) == 0 {
        return 0, nil
    }
    runID, err := store.CreateRunForTasks(ctx, workerID, tasks, now)
    if err != nil {
        return 0, fmt.Errorf("create maintenance run: %w", err)
    }

    successes, skipped, failures := 0, 0, 0
    for _, task := range tasks {
        status, err := processClaimedMaintenanceTask(ctx, store, jobStore, jobs, opts, workerID, runID, task)
        if err != nil {
            failures++
            _ = store.FinishRun(ctx, runID, successes, skipped, failures, time.Now().UTC())
            return len(tasks), err
        }
        switch status {
        case "succeeded":
            successes++
        case "skipped":
            skipped++
        default:
            failures++
        }
    }
    if err := store.FinishRun(ctx, runID, successes, skipped, failures, time.Now().UTC()); err != nil {
        return len(tasks), err
    }
    return len(tasks), nil
}

func processClaimedMaintenanceTask(
    ctx context.Context,
    store *meta.IcebergMaintenanceStore,
    jobStore meta.JobStore,
    jobs map[string]maintenanceWorkerJob,
    opts MaintenanceWorkerOptions,
    workerID string,
    runID int64,
    task meta.IcebergMaintenanceTask,
) (string, error) {
    state, err := store.GetState(ctx, task.TableKey)
    if err != nil {
        return "failed", err
    }
    if state == nil || !state.SnapshotComplete {
        message := "snapshot barrier is not complete"
        if err := store.InsertResult(ctx, maintenancePreflightFailureResult(runID, task, message)); err != nil {
            return "failed", fmt.Errorf("store maintenance preflight result task=%d: %w", task.ID, err)
        }
        if err := store.FinishTask(ctx, task.ID, workerID, meta.MaintenanceTaskRetry, message, timePtr(time.Now().Add(time.Minute))); err != nil {
            return "failed", err
        }
        return "failed", nil
    }

    job, ok, resolveErr := resolveMaintenanceWorkerJob(ctx, jobStore, jobs, task.OwnerJobID)
    if resolveErr != nil {
        return "failed", fmt.Errorf("load owner job configuration task=%d: %w", task.ID, resolveErr)
    }
    if !ok || job.Job.Config == nil {
        message := "owner job configuration is unavailable"
        if err := store.InsertResult(ctx, maintenancePreflightFailureResult(runID, task, message)); err != nil {
            return "failed", fmt.Errorf("store maintenance preflight result task=%d: %w", task.ID, err)
        }
        if err := store.FinishTask(ctx, task.ID, workerID, meta.MaintenanceTaskFailed, message, nil); err != nil {
            return "failed", err
        }
        return "failed", nil
    }

    leaseCtx, leaseCancel := context.WithCancel(ctx)
    var leaseWG sync.WaitGroup
    leaseWG.Add(1)
    go func() {
        defer leaseWG.Done()
        renewEvery := opts.LeaseDuration / 3
        if renewEvery < 10*time.Second {
            renewEvery = 10 * time.Second
        }
        ticker := time.NewTicker(renewEvery)
        defer ticker.Stop()
        for {
            select {
            case <-leaseCtx.Done():
                return
            case <-ticker.C:
                if err := store.RenewLease(leaseCtx, task.ID, workerID, time.Now().Add(opts.LeaseDuration)); err != nil {
                    log.Printf("[maintenance-worker %s] lease renewal task=%d error=%v", workerID, task.ID, err)
                    return
                }
            }
        }
    }()

    outcome := executeNativeMaintenanceTask(ctx, store, task.OwnerJobID, job.Job.Config, *state, task, job.Settings)
    leaseCancel()
    leaseWG.Wait()
    outcome.Result.RunID = runID
    if err := store.InsertResult(ctx, outcome.Result); err != nil {
        return "failed", fmt.Errorf("store maintenance result task=%d: %w", task.ID, err)
    }

    switch outcome.Result.Status {
    case "succeeded":
        _ = store.RecordStateSuccess(ctx, state.TableKey, task.Operation, time.Now().UTC(), task.Operation == "compact")
        if err := store.FinishTask(ctx, task.ID, workerID, meta.MaintenanceTaskSucceeded, "", nil); err != nil {
            return "failed", err
        }
        return "succeeded", nil
    case "skipped":
        _ = store.RecordStateSuccess(ctx, state.TableKey, task.Operation, time.Now().UTC(), false)
        if err := store.FinishTask(ctx, task.ID, workerID, meta.MaintenanceTaskSkipped, "", nil); err != nil {
            return "failed", err
        }
        return "skipped", nil
    default:
        _ = store.RecordStateError(ctx, state.TableKey, outcome.Result.Error)
        retryLimit := retryLimitFromRaw(job.Job.Config)
        if retryLimit <= 0 {
            retryLimit = defaultMaintenanceRetryLimit
        }
        if outcome.Retryable && task.AttemptCount < retryLimit {
            retryAt := time.Now().Add(maintenanceRetryBackoff(task.AttemptCount, retryBackoffFromRaw(job.Job.Config)))
            if err := store.FinishTask(ctx, task.ID, workerID, meta.MaintenanceTaskRetry, outcome.Result.Error, &retryAt); err != nil {
                return "failed", err
            }
        } else if err := store.FinishTask(ctx, task.ID, workerID, meta.MaintenanceTaskFailed, outcome.Result.Error, nil); err != nil {
            return "failed", err
        }
        return "failed", nil
    }
}
''')

          Path('pkg/connectors/iceberg/maintenance_queue_alert.go').write_text(r'''package iceberg

import (
    "context"
    "fmt"
    "log"
    "net/http"
    "net/url"
    "os"
    "strconv"
    "strings"
    "time"

    "github.com/gerinsp/rivus/pkg/meta"
)

const (
    defaultMaintenanceQueueAlertThreshold = 100
    defaultMaintenanceQueueAlertAge       = 30 * time.Minute
    defaultMaintenanceQueueAlertCheck     = time.Minute
    defaultMaintenanceQueueAlertCooldown  = time.Hour
)

type maintenanceQueueAlertSettings struct {
    Enabled          bool
    BotToken         string
    ChatID           string
    PendingThreshold int
    OldestAge        time.Duration
    CheckInterval    time.Duration
    Cooldown         time.Duration
}

type maintenanceQueueAlertManager struct {
    workerID  string
    settings  maintenanceQueueAlertSettings
    client    *http.Client
    lastCheck time.Time
    lastSent  time.Time
    alerting  bool
}

func newMaintenanceQueueAlertManager(workerID string) *maintenanceQueueAlertManager {
    return &maintenanceQueueAlertManager{
        workerID: workerID,
        settings: maintenanceQueueAlertSettingsFromEnv(),
        client:   &http.Client{Timeout: 10 * time.Second},
    }
}

func maintenanceQueueAlertSettingsFromEnv() maintenanceQueueAlertSettings {
    telegramEnabled := envBoolWithFallback("RIVUS_TELEGRAM_ENABLED", "TELEGRAM_ENABLED", false)
    notifyEnabled := envBoolDefault("RIVUS_TELEGRAM_NOTIFY_MAINTENANCE_QUEUE", telegramEnabled)
    return maintenanceQueueAlertSettings{
        Enabled:          telegramEnabled && notifyEnabled,
        BotToken:         strings.TrimSpace(os.Getenv("TELEGRAM_BOT_TOKEN")),
        ChatID:           strings.TrimSpace(os.Getenv("TELEGRAM_CHAT_ID")),
        PendingThreshold: intEnv("RIVUS_MAINTENANCE_QUEUE_ALERT_THRESHOLD", defaultMaintenanceQueueAlertThreshold),
        OldestAge:        durationEnv("RIVUS_MAINTENANCE_QUEUE_ALERT_AGE_SECONDS", defaultMaintenanceQueueAlertAge),
        CheckInterval:    durationEnv("RIVUS_MAINTENANCE_QUEUE_ALERT_CHECK_SECONDS", defaultMaintenanceQueueAlertCheck),
        Cooldown:         durationEnv("RIVUS_MAINTENANCE_QUEUE_ALERT_COOLDOWN_SECONDS", defaultMaintenanceQueueAlertCooldown),
    }
}

func (m *maintenanceQueueAlertManager) MaybeCheck(ctx context.Context, store *meta.IcebergMaintenanceStore, now time.Time) {
    if m == nil || !m.settings.Enabled || m.settings.BotToken == "" || m.settings.ChatID == "" {
        return
    }
    if !m.lastCheck.IsZero() && now.Sub(m.lastCheck) < m.settings.CheckInterval {
        return
    }
    m.lastCheck = now
    summary, err := store.Summary(ctx, now)
    if err != nil {
        log.Printf("[maintenance-worker %s] queue alert summary error=%v", m.workerID, err)
        return
    }
    backlogged := maintenanceQueueBacklogged(summary, m.settings)
    if !backlogged {
        if m.alerting {
            if err := m.send(ctx, formatMaintenanceQueueRecovered(summary)); err != nil {
                log.Printf("[maintenance-worker %s] queue recovery notification error=%v", m.workerID, err)
                return
            }
            m.alerting = false
        }
        return
    }
    if m.alerting && !m.lastSent.IsZero() && now.Sub(m.lastSent) < m.settings.Cooldown {
        return
    }
    if err := m.send(ctx, formatMaintenanceQueueBacklog(summary, m.settings)); err != nil {
        log.Printf("[maintenance-worker %s] queue backlog notification error=%v", m.workerID, err)
        return
    }
    m.alerting = true
    m.lastSent = now
}

func maintenanceQueueBacklogged(summary meta.IcebergMaintenanceSummary, settings maintenanceQueueAlertSettings) bool {
    pending := summary.QueuedTasks + summary.RetryTasks
    return pending >= settings.PendingThreshold && time.Duration(summary.OldestQueuedAgeSec)*time.Second >= settings.OldestAge
}

func formatMaintenanceQueueBacklog(summary meta.IcebergMaintenanceSummary, settings maintenanceQueueAlertSettings) string {
    pending := summary.QueuedTasks + summary.RetryTasks
    return fmt.Sprintf("⚠️ Rivus Maintenance Queue Backlog\n\n• Pending: %d\n• Queued: %d\n• Retry: %d\n• Active leases: %d\n• Oldest pending: %s\n• Alert threshold: %d tasks for %s",
        pending, summary.QueuedTasks, summary.RetryTasks, summary.ActiveLeases,
        formatMaintenanceQueueAge(summary.OldestQueuedAgeSec), settings.PendingThreshold, settings.OldestAge)
}

func formatMaintenanceQueueRecovered(summary meta.IcebergMaintenanceSummary) string {
    pending := summary.QueuedTasks + summary.RetryTasks
    return fmt.Sprintf("✅ Rivus Maintenance Queue Recovered\n\n• Pending: %d\n• Queued: %d\n• Retry: %d\n• Active leases: %d",
        pending, summary.QueuedTasks, summary.RetryTasks, summary.ActiveLeases)
}

func formatMaintenanceQueueAge(seconds int64) string {
    if seconds <= 0 {
        return "0s"
    }
    return (time.Duration(seconds) * time.Second).Round(time.Second).String()
}

func (m *maintenanceQueueAlertManager) send(ctx context.Context, text string) error {
    values := url.Values{}
    values.Set("chat_id", m.settings.ChatID)
    values.Set("text", text)
    values.Set("disable_web_page_preview", "true")
    endpoint := fmt.Sprintf("https://api.telegram.org/bot%s/sendMessage", m.settings.BotToken)
    req, err := http.NewRequestWithContext(ctx, http.MethodPost, endpoint, strings.NewReader(values.Encode()))
    if err != nil {
        return err
    }
    req.Header.Set("Content-Type", "application/x-www-form-urlencoded")
    resp, err := m.client.Do(req)
    if err != nil {
        return err
    }
    defer resp.Body.Close()
    if resp.StatusCode < 200 || resp.StatusCode >= 300 {
        return fmt.Errorf("telegram sendMessage failed: %s", resp.Status)
    }
    return nil
}

func envBoolWithFallback(primary, secondary string, fallback bool) bool {
    if value, ok := envBoolLookup(primary); ok {
        return value
    }
    if value, ok := envBoolLookup(secondary); ok {
        return value
    }
    return fallback
}

func envBoolDefault(key string, fallback bool) bool {
    if value, ok := envBoolLookup(key); ok {
        return value
    }
    return fallback
}

func envBoolLookup(key string) (bool, bool) {
    raw, ok := os.LookupEnv(key)
    if !ok || strings.TrimSpace(raw) == "" {
        return false, false
    }
    value, err := strconv.ParseBool(strings.TrimSpace(raw))
    if err != nil {
        return false, false
    }
    return value, true
}
