name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Check UI modules
        run: |
          for file in \
            ui/app.js \
            ui/core/api.js \
            ui/jobs.js \
            ui/logs.js \
            ui/job-detail.js \
            ui/iceberg-maintenance.js \
            ui/errors.js; do
            node --input-type=module --check < "$file"
          done
          grep -q '<script type="module" src="app.js?v=8"></script>' ui/index.html
          ! grep -q 'maintenance-ui.js' ui/index.html

      - name: Resolve and commit temporary fork checksum
        if: github.event_name == 'pull_request'
        run: |
          go mod tidy
          if ! git diff --quiet -- go.sum; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add go.sum
            git commit -m "chore: refresh go.sum for patched iceberg-go"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Test
        run: go test ./...
