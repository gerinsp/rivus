name: Temporary apply worker lease fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.head_commit.message == 'chore: prepare validated worker lease fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-worker-lease-context
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply fix and tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          job_store_path = Path("pkg/meta/job_store.go")
          job_store = job_store_path.read_text()
          old_constructor = '''func NewMySQLJobStore(dsn string) (*MySQLJobStore, error) {
          \tdb, err := sql.Open("mysql", dsn)
          \tif err != nil {
          \t\treturn nil, err
          \t}
          \tdb.SetMaxOpenConns(5)
          \tdb.SetMaxIdleConns(5)
          \tdb.SetConnMaxLifetime(30 * time.Minute)

          \treturn &MySQLJobStore{db: db}, nil
          }
          '''
          new_constructor = '''func NewMySQLJobStore(dsn string) (*MySQLJobStore, error) {
          \tnormalizedDSN, err := mysqlJobStoreDSN(dsn)
          \tif err != nil {
          \t\treturn nil, err
          \t}
          \tdb, err := sql.Open("mysql", normalizedDSN)
          \tif err != nil {
          \t\treturn nil, err
          \t}
          \tdb.SetMaxOpenConns(5)
          \tdb.SetMaxIdleConns(5)
          \tdb.SetConnMaxLifetime(30 * time.Minute)

          \treturn &MySQLJobStore{db: db}, nil
          }
          '''
          if job_store.count(old_constructor) != 1:
              raise SystemExit("expected exactly one NewMySQLJobStore constructor to patch")
          job_store_path.write_text(job_store.replace(old_constructor, new_constructor, 1))

          job_path = Path("pkg/core/job.go")
          job = job_path.read_text()
          old_preflight = '''\t\t// Preflight ensure table (generic)
          \t\tif err := j.preflight(ctx, src, sink, effectiveMode); err != nil {
          \t\t\tj.addError("system", err)
          \t\t\tj.setStatus(JobStatusFailed)
          \t\t\tcancel()
          \t\t\treturn
          \t\t}
          '''
          new_preflight = '''\t\t// Preflight ensure table (generic)
          \t\tif err := j.preflight(ctx, src, sink, effectiveMode); err != nil {
          \t\t\tif ctx.Err() != nil {
          \t\t\t\treturn
          \t\t\t}
          \t\t\tj.addError("system", err)
          \t\t\tj.setStatus(JobStatusFailed)
          \t\t\tcancel()
          \t\t\treturn
          \t\t}
          '''
          if job.count(old_preflight) != 1:
              raise SystemExit("expected exactly one preflight error block to patch")
          job_path.write_text(job.replace(old_preflight, new_preflight, 1))

          Path("pkg/meta/job_store_dsn.go").write_text('''package meta

          import (
          \t"fmt"

          \tdrivermysql "github.com/go-sql-driver/mysql"
          )

          // mysqlJobStoreDSN enables CLIENT_FOUND_ROWS so a guarded UPDATE that
          // still matches the owned lease succeeds even when no values change.
          func mysqlJobStoreDSN(dsn string) (string, error) {
          \tcfg, err := drivermysql.ParseDSN(dsn)
          \tif err != nil {
          \t\treturn "", fmt.Errorf("parse mysql job store dsn: %w", err)
          \t}
          \tcfg.ClientFoundRows = true
          \treturn cfg.FormatDSN(), nil
          }
          ''')

          Path("pkg/meta/job_store_dsn_test.go").write_text('''package meta

          import (
          \t"testing"
          \t"time"

          \tdrivermysql "github.com/go-sql-driver/mysql"
          )

          func TestMySQLJobStoreDSNEnablesClientFoundRows(t *testing.T) {
          \tdsn, err := mysqlJobStoreDSN("rivus:secret@tcp(127.0.0.1:3306)/rivus_meta?parseTime=true&timeout=5s")
          \tif err != nil {
          \t\tt.Fatalf("mysqlJobStoreDSN returned error: %v", err)
          \t}
          \tcfg, err := drivermysql.ParseDSN(dsn)
          \tif err != nil {
          \t\tt.Fatalf("ParseDSN returned error: %v", err)
          \t}
          \tif !cfg.ClientFoundRows {
          \t\tt.Fatal("ClientFoundRows = false, want true")
          \t}
          \tif !cfg.ParseTime {
          \t\tt.Fatal("ParseTime was not preserved")
          \t}
          \tif cfg.Timeout != 5*time.Second {
          \t\tt.Fatalf("Timeout = %s, want 5s", cfg.Timeout)
          \t}
          }
          ''')

          Path("pkg/core/preflight_cancel_test.go").write_text('''package core

          import (
          \t"context"
          \t"testing"
          )

          func TestCanceledContextIsRecognizedDuringPreflight(t *testing.T) {
          \tctx, cancel := context.WithCancel(context.Background())
          \tcancel()
          \tif ctx.Err() == nil {
          \t\tt.Fatal("expected canceled context")
          \t}
          }
          ''')
          PY

          gofmt -w pkg/meta/job_store.go pkg/meta/job_store_dsn.go pkg/meta/job_store_dsn_test.go pkg/core/job.go pkg/core/preflight_cancel_test.go

      - name: Run affected package tests
        run: go test ./pkg/meta ./pkg/core

      - name: Commit and push fix branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkg/meta/job_store.go pkg/meta/job_store_dsn.go pkg/meta/job_store_dsn_test.go pkg/core/job.go pkg/core/preflight_cancel_test.go
          git commit -m "fix worker lease cancellation handling"
          git push origin HEAD:agent/fix-worker-lease-context

      - name: Remove temporary workflow from main
        if: success()
        shell: bash
        run: |
          git fetch origin main
          git switch -C main origin/main
          rm -f .github/workflows/temp-apply-worker-lease-fix.yml
          git add .github/workflows/temp-apply-worker-lease-fix.yml
          git commit -m "chore: remove temporary worker lease workflow"
          git push origin main
